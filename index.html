<!DOCTYPE html>
<html>
<head>
    <title>AETHER X-RAY V28 // ADMIN INJECTOR</title>
    <style>
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; }
        #game-bg { width: 100%; height: 100vh; border: none; filter: brightness(0.4); }
        
        #cracker-panel {
            position: absolute; top: 10%; right: 5%;
            width: 300px; background: rgba(0, 10, 0, 0.95);
            border: 2px solid #00ff00; border-radius: 5px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            padding: 20px; z-index: 10000; color: #0f0;
        }

        .terminal-header { font-size: 0.7em; border-bottom: 1px solid #0f0; margin-bottom: 10px; padding-bottom: 5px; }
        
        .input-field {
            background: #000; border: 1px solid #0f0; color: #0f0;
            width: 100%; padding: 12px; font-size: 1.5em; text-align: center;
            margin-bottom: 10px; box-sizing: border-box; outline: none;
        }

        .btn-inject {
            background: #00ff00; color: #000; border: none;
            width: 100%; padding: 15px; font-weight: bold;
            cursor: pointer; letter-spacing: 2px;
        }

        #cracking-status { font-size: 0.8em; margin: 10px 0; display: none; }
        
        #final-result {
            display: none; text-align: center; border-top: 2px solid #0f0;
            margin-top: 15px; padding-top: 15px;
        }

        .cracked-number { font-size: 5em; color: #fff; text-shadow: 0 0 20px #fff; line-height: 1; }
        .data-stream { font-size: 0.6em; color: #008800; overflow: hidden; white-space: nowrap; }
    </style>
</head>
<body>

    <iframe id="game-bg" src="https://maanwin.site/"></iframe>

    <div id="cracker-panel">
        <div class="terminal-header">AETHER_V28 // SERVER_INJECTOR_ROOT</div>
        
        <input type="number" id="periodInput" class="input-field" placeholder="ENTER PERIOD">
        <button class="btn-inject" onclick="runCracker()">EXTRACT DATA</button>

        <div id="cracking-status">
            <div class="data-stream" id="stream1">CONNECTING_TO_MAANWIN_API...</div>
            <div class="data-stream" id="stream2">BYPASSING_SSL_PINNING...</div>
            <div class="data-stream" id="stream3">EXTRACTING_RESULT_PACKET...</div>
        </div>

        <div id="final-result">
            <div style="font-size: 0.7em;">RESULT_EXTRACTED_SUCCESSFULLY:</div>
            <div class="cracked-number" id="resNum">?</div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-top:10px;">
                <span id="resColor">---</span>
                <span id="resSize">---</span>
            </div>
            <div style="font-size: 0.6em; color: #fff; margin-top: 10px; letter-spacing: 3px;">
                STATUS: 100% SECURE_LOCK
            </div>
        </div>
    </div>

    <script>
        function runCracker() {
            const period = document.getElementById('periodInput').value;
            if(!period) return;

            // Reset UI
            document.getElementById('cracking-status').style.display = 'block';
            document.getElementById('final-result').style.display = 'none';

            fetch('/inject', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ period: period })
            })
            .then(res => res.json())
            .then(data => {
                // Show Result with a slight delay to mimic cracking
                setTimeout(() => {
                    document.getElementById('cracking-status').style.display = 'none';
                    document.getElementById('final-result').style.display = 'block';
                    
                    document.getElementById('resNum').innerText = data.number;
                    document.getElementById('resColor').innerText = data.color;
                    document.getElementById('resSize').innerText = data.size;

                    // Color logic for Hybrid Numbers
                    const colorLabel = document.getElementById('resColor');
                    if(data.color.includes("VIOLET")) {
                        colorLabel.style.color = "#cc00ff";
                    } else if(data.color === "GREEN") {
                        colorLabel.style.color = "#00ff00";
                    } else {
                        colorLabel.style.color = "#ff0000";
                    }
                }, 1500);
            });
        }
    </script>
</body>
</html>
